name: 更新菜價行情
on:
  schedule:
    - cron: "0 22 * * *"   # 每天 UTC 22:00 = 台北 06:00
  workflow_dispatch: {}     # 手動觸發：Actions 頁面按 Run workflow
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 抓取行情
        run: node scripts/update_prices.mjs
      - name: 提交 prices.json
        run: |
          git config user.name "price-bot"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "行情更新 $(date +'%Y-%m-%d')"
          git push
